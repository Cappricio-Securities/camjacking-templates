    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Google Sans Flex', 'Inter', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #202124;
            /* Google dark grey */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #fff;
        }

        .container {
            width: 100vw;
            height: 80vh;
            display: flex;
            position: fixed;
            top: 10%;
            left: 5%;
            gap: 40px;
        }

        /* ============ MAIN CAMERA AREA ============ */
        .camera-wrapper {
            flex: 1;
            position: relative;
            background: #fff;
            overflow: hidden;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video,
        canvas {
            position: absolute;
            width: 100%;
            height: 65%;
            object-fit: cover;
            display: block;
            top: 100px;
            left: 0;
            border-radius: 10px;
        }

        /* ============ LEFT SIDEBAR ICONS ============ */
        .left-icons {
            position: absolute;
            left: 12px;
            top: -85px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 50;
            margin-top: 20%;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }

        /* ============ TOP RIGHT ICONS ============ */
        .top-icons {
            position: absolute;
            top: 60px;
            left: 12px;
            right: 12px;
            /* Stretch full width */
            display: flex;
            justify-content: space-between;
            /* Push icons apart */
            align-items: center;
            z-index: 50;
        }

        /* Hover animation */
        .filter-btn:hover {
            transform: scale(1.1);
            transition: 0.2s ease;
        }

        .top-icons {
            position: absolute;
            top: 35px;
            left: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .icon-btn i {
            color: white;
            font-size: 22px;
        }

        #videoFeed {
            transition: filter 0.3s ease;
            will-change: filter;
        }

        .right-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #111;
        }

        .main-title {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 30px;
            margin-left: 20%;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            margin-left: 16%;
        }

        .primary-btn,
        .secondary-btn {
            padding: 15px 24px;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: #666 0px 2px 8px -2px;
        }

        .primary-btn {
            background: #1a73e8;
            color: white;
        }

        .primary-btn:hover {
            background: #0c438b;
        }

        .secondary-btn {
            background: #fff;
            color: #1a73e8;
        }

        .secondary-btn:hover {
            background: #ddd;
        }

        .info-texts p {
            font-size: 14px;
            color: #1a73e8;
            margin-bottom: 3px;
            margin-left: 20%;
            font-weight: 500;
        }

        .camera-wrapper {
            position: relative;
            overflow: hidden;
        }

        /* ===== Top Right Menu ===== */
        .camera-top {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
        }

        .menu-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            color: white;
            display: flex;
            margin-top: 250%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* ===== Bottom Controls ===== */
        .camera-bottom {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .round-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        /* White button */
        .white-btn {
            background: rgba(255, 255, 255, 0.15);
            /* transparent white */
            color: #fff;
            border: 2px solid #fff;
            backdrop-filter: blur(8px);
            /* optional glass effect */
        }

        .red-btn {
            background: rgba(255, 255, 255, 0.15);
            /* transparent white */
            color: #fff;
            border: 2px solid #fff;
            backdrop-filter: blur(8px);
        }


        /* Hover effect */
        .round-btn:hover,
        .menu-btn:hover {
            transform: scale(1.1);
        }

        .camera-logo {
            position: absolute;
            top: 15px;
            left: 15px;
            /* change to center if needed */
            z-index: 100;
        }

        .camera-logo img {
            height: 40px;
            /* adjust size */
            width: auto;
            object-fit: contain;
        }

        @media (max-width: 768px) {

            body {
                margin: 0;
                overflow: hidden;
                background: #000;
            }

            .container {
                flex-direction: column;
                width: 100%;
                height: 100dvh;
                top: 0;
                left: 0;
                gap: 0;
                position: relative;
            }

            /* ===== 70% CAMERA SECTION ===== */
            .camera-wrapper {
                height: 70vh;
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                background: #fff;
                padding-top: 20px;
            }

            /* Logo */
            .camera-logo {
                position: relative;
                margin-bottom: 15px;
            }

            .camera-logo img {
                height: 32px;
            }

            /* Camera Card */
            video,
            canvas {
                position: relative;
                width: 90%;
                aspect-ratio: 9 / 16;
                object-fit: cover;
                border-radius: 22px;
                background: #fff;
                top: 35px;
            }

            /* Camera buttons inside card */
            .camera-bottom {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 18px;
            }

            .round-btn {
                width: 44px;
                height: 44px;
                font-size: 14px;
            }

            .camera-top {
                position: absolute;
                top: 70px;
                right: 25px;
            }

            /* ===== 30% BOTTOM SECTION ===== */
            .right-content {
                height: 30vh;
                background: #fff;
                padding: 20px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }

            .menu-btn {
                margin-top: 130%;
            }

            .main-title {
                font-size: 20px;
                margin-bottom: 15px;
                margin-left: 0;
            }

            .btn-group {
                display: flex;
                justify-content: center;
                gap: 12px;
                margin-bottom: 10px;
                margin-left: 0;
            }

            .primary-btn,
            .secondary-btn {
                padding: 10px 16px;
                font-size: 14px;
                border-radius: 22px;
            }

            .info-texts p {
                font-size: 13px;
                margin: 3px 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">


        <!-- Camera Wrapper -->
        <div class="camera-wrapper">
            <div class="camera-logo">
                <img src="images/meet.png" alt="Logo">
            </div>

            <video id="videoFeed" autoplay playsinline muted webkit-playsinline></video>
            <canvas id="filterCanvas"></canvas>

            <!-- Top Right 3 Dots -->
            <div class="camera-top">
                <button class="menu-btn">
                    <i class="fas fa-ellipsis-vertical"></i>
                </button>
            </div>

            <!-- Bottom Round Buttons -->
            <div class="camera-bottom">
                <button class="round-btn white-btn">
                    <i class="fas fa-video"></i>
                </button>

                <button class="round-btn red-btn">
                    <i class="fas fa-phone"></i>
                </button>
            </div>

        </div>

        <!-- Right Content Section -->
        <div class="right-content">
            <h1 class="main-title">Ready to join ?</h1>

            <div class="btn-group">
                <button class="primary-btn">Join now</button>
                <button class="secondary-btn">
                    <i class="fas fa-desktop"></i> Present
                </button>

            </div>

            <div class="info-texts">
                <p><i class="fas fa-phone"></i> &nbsp;Join and use phone for audio</p>
                <p><i class="fas fa-video"></i> &nbsp;Connect a conference room</p>
            </div>
        </div>

    </div>

    <script>
        class CameraController {
            constructor(videoElement) {
                this.video = videoElement;
                this.stream = null;
                this.facingMode = "user";
            }

            async start() {
                await this.stop();

                const constraints = {
                    video: {
                        facingMode: this.facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                this.video.srcObject = this.stream;
                await this.video.play();

                this.applyMirror();
            }

            async stop() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
            }

            async flip() {
                this.facingMode = this.facingMode === "user" ? "environment" : "user";
                await this.start();
            }

            applyMirror() {
                this.video.style.transform =
                    this.facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
            }

            capture(canvas) {
                const ctx = canvas.getContext("2d");
                canvas.width = this.video.videoWidth;
                canvas.height = this.video.videoHeight;

                if (this.facingMode === "user") {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                ctx.drawImage(this.video, 0, 0, canvas.width, canvas.height);
            }
        }


        class FilterController {
            constructor(videoElement) {
                this.video = videoElement;
            }

            apply(filterValue) {
                this.video.style.filter = filterValue;
            }
        }


        class UIController {
            constructor(camera, filters) {
                this.camera = camera;
                this.filters = filters;
                this.flipBtn = document.getElementById("flipBtn");
                this.filterScroll = document.getElementById("filterScroll");
                this.captureBtn = document.getElementById("captureBtn");
            }

            initFilters() {
                Object.keys(this.filters.filters).forEach(filterKey => {
                    const btn = document.createElement("button");
                    btn.className = "nav-btn";
                    btn.textContent = filterKey.toUpperCase();

                    btn.addEventListener("click", () => {
                        this.filters.apply(filterKey);
                    });

                    this.filterScroll.appendChild(btn);
                });
            }

            initEvents() {
                this.flipBtn.addEventListener("click", () => this.camera.flip());

                this.captureBtn.addEventListener("click", () => {
                    const canvas = document.createElement("canvas");
                    this.camera.capture(canvas);

                    const link = document.createElement("a");
                    link.download = "capture.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                });
            }
        }


        // ============ APP INIT ============

        window.addEventListener("load", async () => {
            const video = document.getElementById("videoFeed");

            const camera = new CameraController(video);
            const filters = new FilterController(video);
            const ui = new UIController(camera, filters);

            await camera.start();
            ui.initFilters();
            ui.initEvents();
        });

        window.addEventListener("load", async () => {
            const video = document.getElementById("videoFeed");

            const camera = new CameraController(video);

            await camera.start();

            // FILTER BUTTON LOGIC
            const filterButtons = document.querySelectorAll(".filter-btn");

            filterButtons.forEach(btn => {
                btn.addEventListener("click", () => {

                    filterButtons.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");

                    const filterValue = btn.getAttribute("data-filter");

                    video.style.filter = filterValue;
                });
            });

            // Flip button
            document.getElementById("flipBtn")
                .addEventListener("click", () => camera.flip());

            // Capture button
            document.getElementById("captureBtn")
                .addEventListener("click", () => {
                    const canvas = document.createElement("canvas");
                    camera.capture(canvas);

                    const link = document.createElement("a");
                    link.download = "capture.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                });
        });



        // Safari visibility fix
        document.addEventListener("visibilitychange", async () => {
            if (document.hidden) {
                const video = document.getElementById("videoFeed");
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
            }
        });

        const filterButtons = document.querySelectorAll(".filter-btn");

        filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {

                filterButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");

                const filterValue = btn.getAttribute("data-filter");
                filters.apply(filterValue);
            });
        });




    </script>

</body>

</html>
